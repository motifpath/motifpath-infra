name: Validate Infrastructure

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  TERRAFORM_VERSION: '1.16.6'

jobs:
  format:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive
        # Fix locally with: terraform fmt -recursive

  validate:
    name: Validate ${{ matrix.root }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [bootstrap, environments/shared, environments/staging, environments/production]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init (no backend)
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ matrix.root }}
        run: terraform validate

  # Needs read access to the account and the state bucket. Skipped until a
  # plan role exists and its ARN is set as the AWS_PLAN_ROLE_ARN variable.
  plan:
    name: Plan ${{ matrix.root }} (on PR)
    runs-on: ubuntu-latest
    needs: [format, validate]
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        root: [environments/shared, environments/staging, environments/production]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-2

      - name: Terraform init
        working-directory: ${{ matrix.root }}
        run: terraform init -input=false

      # Printed for review, not kept: applies are run by hand.
      # BUDGET_ALERT_EMAILS is a comma-separated list; Terraform reads a list
      # variable from the environment only in list syntax, which JSON is.
      - name: Terraform plan
        working-directory: ${{ matrix.root }}
        env:
          TF_VAR_dmarc_record: ${{ vars.DMARC_RECORD }}
          BUDGET_ALERT_EMAILS: ${{ vars.BUDGET_ALERT_EMAILS }}
        run: |
          TF_VAR_budget_alert_emails=$(jq -cn --arg emails "$BUDGET_ALERT_EMAILS" \
            '$emails | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))')
          export TF_VAR_budget_alert_emails
          terraform plan -input=false -lock=false -no-color

  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [format, validate]
    steps:
      - run: echo "All infrastructure validations passed"
